services:
  postgres:
    image: postgres:16
    container_name: monden-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: monden
      POSTGRES_USER: monden
      POSTGRES_PASSWORD: monden
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/001-database.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
